version: 2
updates:
  # Dependency Rust diperbarui mingguan. Untuk tool keamanan, dependency yang
  # sudah usang adalah permukaan serangan — bukan sekadar urusan kerapian.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"