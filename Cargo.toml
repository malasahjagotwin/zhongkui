[package]
name = "zhongkui"
version = "0.1.0"
edition = "2024"
# edition 2024 mensyaratkan 1.85; fitur lain yang dipakai (LazyLock, div_ceil)
# lebih lama lagi, jadi 1.85 adalah batas bawahnya.
rust-version = "1.85"
description = "Auditor keamanan source code dengan bantuan LLM: rule deterministik offline + triase LLM opt-in"
license = "MIT OR Apache-2.0"
repository = "https://github.com/malasahjagotwin/zhongkui"
readme = "README.md"
keywords = ["security", "audit", "sast", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
colored = "3.1.1"
ignore = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.2.1"

[profile.release]
lto = "thin"
strip = true